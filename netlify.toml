[build]
  # Dossier de build pour le site statique
  publish = "."
  
  # Dossier des fonctions Netlify
  functions = "netlify/functions"

[build.environment]
  # Variables d'environnement pour le build (si nécessaire)
  NODE_VERSION = "18"

# Redirections pour l'API seulement
[[redirects]]
  # Redirect webhook vers la Netlify Function
  from = "/api/payments/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  # Redirect autres endpoints API vers ton backend Render (si tu veux garder le backend pour create-session)
  from = "/api/payments/*"
  to = "https://fvs-backend-1.onrender.com/api/payments/:splat"
  status = 200
  force = false

# Headers de sécurité
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, stripe-signature"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache headers pour assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://api.stripe.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://api.stripe.com https://api.printful.com;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
