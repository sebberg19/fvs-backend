<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>Nouvelle commande - Futbolero</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f6f6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background:#f6f6f6;">
      <tr>
        <td align="center" style="padding:40px 16px;">

          <table role="presentation" width="540" cellpadding="0" cellspacing="0" style="width:540px;max-width:540px;border-collapse:collapse;background:#ffffff;border-radius:12px;border:1px solid #e8e8e8;">

            <!-- Logo -->
            <tr>
              <td align="center" style="padding:32px 32px 24px 32px;border-bottom:1px solid #eeeeee;">
                <img src="https://futbolerovintageshop.com/assets/FVS_SVG.svg" alt="Futbolero Vintage Shop" style="height:46px;width:auto;display:block;">
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:28px 32px;">

                <p style="margin:0 0 24px 0;font-family:Arial,sans-serif;font-size:15px;color:#111111;font-weight:600;">Nouvelle commande reçue</p>

                <!-- Client -->
                <p style="margin:0 0 6px 0;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#aaaaaa;">Client</p>
                <p style="margin:0 0 24px 0;font-family:Arial,sans-serif;font-size:14px;color:#333333;line-height:20px;">
                  {{contact_name}}<br>
                  <span style="color:#777777;">{{contact_email}}</span>
                </p>

                <!-- Articles -->
                <p style="margin:0 0 6px 0;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#aaaaaa;">Articles</p>
                <div style="font-family:Arial,sans-serif;font-size:14px;color:#333333;line-height:22px;margin-bottom:16px;">
                  {{items_html}}
                </div>

                <!-- Divider -->
                <div style="height:1px;background:#eeeeee;margin:0 0 16px 0;font-size:1px;line-height:1px;">&nbsp;</div>

                <!-- Total -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                  <tr>
                    <td style="font-family:Arial,sans-serif;font-size:13px;color:#777777;">Total</td>
                    <td align="right" style="font-family:Arial,sans-serif;font-size:15px;font-weight:700;color:#111111;">{{total}}</td>
                  </tr>
                </table>

              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center" style="padding:16px 32px 24px 32px;border-top:1px solid #eeeeee;">
                <p style="margin:0;font-family:Arial,sans-serif;font-size:11px;color:#bbbbbb;line-height:18px;">
                  Email automatique · <a href="https://futbolerovintageshop.com" style="color:#bbbbbb;text-decoration:none;">futbolerovintageshop.com</a>
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
