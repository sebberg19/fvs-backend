<!-- Script d'internationalisation et conversion de devises -->
<script>
// Chargement du script i18n-currency.js via les différents chemins possibles
(function loadI18nScript() {
  const possiblePaths = [
    './maillots-store/client/src/scripts/i18n-currency.js',
    '../scripts/i18n-currency.js',
    './scripts/i18n-currency.js'
  ];
  
  function tryLoadScript(paths, index = 0) {
    if (index >= paths.length) {
      console.warn('Script i18n-currency.js not found in any expected location');
      return;
    }
    
    const script = document.createElement('script');
    script.src = paths[index];
    script.async = true;
    script.onload = () => {
      console.log('✅ I18n and currency script loaded from:', paths[index]);
    };
    script.onerror = () => {
      tryLoadScript(paths, index + 1);
    };
    document.head.appendChild(script);
  }
  
  tryLoadScript(possiblePaths);
})();
</script>
