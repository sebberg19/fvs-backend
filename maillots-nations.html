        :root {
            --bg: #f7f8f9; --surface: #ffffff; --text: #121314; --muted: #6b6f76; --border: #e9ebf0;

        /* Navigation sticky globale - fonctionne sur toutes les pages */

            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 1050 !important;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;

        #site-header .navbar {
            position: relative !important;
            background: transparent !important;
            box-shadow: none !important;
            margin: 0 !important;
        }
        
        #site-header .sticky-top {
            position: static !important;
        }
        
        /* Compenser la hauteur de la navbar fixe */
        body {
            padding-top: 76px !important;
        }
        
        @media (max-width: 991.98px) {

            }
        }
        .navbar .navbar-brand { color: var(--text); }
        .nav-link { color: var(--muted) !important; }
    .nav-link.active, .nav-link:hover { color: var(--text) !important; font-weight:700; }
        .btn-accent {
            --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent);
            --bs-btn-hover-bg: #285a33; --bs-btn-hover-border-color: #285a33;
            --bs-btn-color: var(--accent-contrast); --bs-btn-focus-shadow-rgb: 47,111,62;
        }
        /* Disable color changes but allow a very light scale on hover; always white text */
        .btn-accent,
        .btn-dark {
            transition: transform .12s ease, box-shadow .12s ease;
            transform-origin: center center;
        }

        .btn-accent,
        .btn-accent:focus,
        .btn-accent:active {
            background-color: var(--accent) !important;
            border-color: var(--accent) !important;
            color: var(--accent-contrast) !important;
            box-shadow: none !important;
            text-decoration: none !important;
        }
        .btn-dark,
        .btn-dark:focus,
        .btn-dark:active {
            background-color: #000 !important;
            border-color: #000 !important;
            color: #fff !important;
            box-shadow: none !important;
            text-decoration: none !important;
        }

    /* Subtle scale on hover for primary buttons (green and black) */
    .btn-accent, .btn-dark { transition: transform .12s ease; transform-origin: center center; }
    .btn-accent:hover, .btn-dark:hover { transform: scale(1.035); }
        /* Keep colors fixed on hover/focus/active; white text on colored backgrounds */
        .btn-accent:hover, .btn-accent:focus, .btn-accent:active, .btn-accent:visited {
            background-color: var(--accent) !important;
            border-color: var(--accent) !important;
            color: var(--accent-contrast) !important;
            text-decoration: none !important;
        }
        .btn-dark:hover, .btn-dark:focus, .btn-dark:active, .btn-dark:visited {
            background-color: #000 !important;
            border-color: #000 !important;
            color: #fff !important;
            text-decoration: none !important;
        }
        .card { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
        .card .card-text { color: var(--muted); }
        .footer { border-top: 1px solid var(--border); color: var(--muted); background: var(--surface); }
        .cart-btn { position: relative; }
        .cart-count {
            position: absolute; top: -6px; right: -8px; font-size: .7rem;
            background: var(--accent); color: var(--accent-contrast); border: 2px solid var(--surface);
        }
        /* Supprime complètement tous les espacements entre les produits */
        .row.g-0 .col-6,
        .row.g-0 .col-md-4,
        .row.g-0 .col-lg-3 {
            padding: 0 !important;
            margin: 0 !important;
        }
        .row.g-0 .card {
            margin: 0 !important;
            border-radius: 0 !important;
        }
        .row.g-0 .card-body {
            margin: 0 !important;
        }
        .row.g-0 .ratio {
            margin: 0 !important;
        }
        .row.g-0 {
            margin: 0 !important;
        }
        
        /* Professional Product Layout - same as maillots-vintage */
        .product-grid {
          margin: 0;
        }
        
        .product-card {
          border: 1px solid var(--border);
          background: var(--surface);
          transition: all 0.3s ease;
          cursor: pointer;
          height: 100%;
          display: flex;
          flex-direction: column;
        }
        
        .product-card:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 25px rgba(0,0,0,0.08);
          border-color: var(--accent);
        }
        
        .product-image {
          position: relative;
          overflow: hidden;
          background: #f8f9fa;
        }
        
        .product-image img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform 0.3s ease;
          cursor: pointer;
        }
        
        .product-card:hover .product-image img {
          transform: scale(1.05);
        }
        
        /* Style pour les images cliquables */
        .product-image.clickable {
          cursor: pointer;
        }
        
        .product-image.clickable:hover {
          opacity: 0.9;
        }
        
        .product-info {
          padding: 1rem;
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          gap: 0.5rem;
        }
        
        .product-title {
          font-size: 0.9rem;
          font-weight: 600;
          color: var(--text);
          margin: 0;
          line-height: 1.3;
        }
        
        .product-price {
          font-size: 0.85rem;
          color: #000;
          font-weight: 600;
          margin: 0.25rem 0;
        }
        
        .product-btn {
          background: #000 !important;
          color: #fff !important;
          border: none;
          padding: 0.4rem 0.8rem;
          font-size: 0.8rem;
          font-weight: 500;
          border-radius: 4px;
          transition: transform 0.2s ease;
          width: 100%;
          margin-top: auto;
        }
        
        .vintage-badge {
          position: absolute;

          right: 0.5rem;

          color: white;

        /* Ajustement pour la navbar fixe */

    <!-- Page script: année + interactions -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();


        function normalizeText(s) {
            return (s || '').toString().toLowerCase().normalize('NFD').replace(/[ -\u036f]/g, '').replace(/\p{Diacritic}/gu, '');
        }

        // Les images sont maintenant directement cliquables gr�ce aux classes add-to-cart sur les divs product-image

        // Configuration du panier (localStorage)
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        // Ajouter au panier
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('add-to-cart') || e.target.closest('.add-to-cart')) {
                const element = e.target.classList.contains('add-to-cart') ? e.target : e.target.closest('.add-to-cart');
                const price = parseFloat(element.dataset.price);
                const vintage = element.dataset.vintage === 'true';
                const imgSrc = element.dataset.img;
                const productTitle = element.closest('.product-card').querySelector('.product-title').textContent;

                const item = {
                    id: Date.now(),
                    name: productTitle,
                    price: price,
                    vintage: vintage,
                    img: imgSrc,
                    quantity: 1
                };

                cart.push(item);
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartBadge();

                // Animation sur le bouton s'il existe
                const btn = element.classList.contains('product-btn') ? element : element.closest('.product-card').querySelector('.product-btn');
                if (btn) {
                    btn.textContent = '✓ Ajouté';
                    btn.classList.remove('btn-dark');
                    btn.classList.add('btn-success');
                    setTimeout(() => {
                        btn.textContent = 'Ajouter';
                        btn.classList.remove('btn-success');
                        btn.classList.add('btn-dark');
                    }, 1500);
                }
            }
        });

        function updateCartBadge() {
            const badge = document.querySelector('.cart-badge');
            if (badge) {
                const count = cart.reduce((sum, item) => sum + item.quantity, 0);
                badge.textContent = count;
                badge.style.display = count > 0 ? 'inline' : 'none';
            }
        }

        // Initialiser au chargement avec délais pour s'assurer que tout est prêt
        document.addEventListener('DOMContentLoaded', function() {
            makeProductImagesClickable();
            updateCartBadge();
            
            // Essayer à nouveau après 500ms au cas où certains éléments tardent à se charger
            setTimeout(() => {
                makeProductImagesClickable();
            }, 500);
            
            // Et une fois de plus après 1000ms pour être sûr
            setTimeout(() => {
                makeProductImagesClickable();
            }, 1000);
        });
        
        // Aussi s'assurer que cela fonctionne même si DOMContentLoaded a déjà été déclenché
        window.addEventListener('load', function() {
            makeProductImagesClickable();
            updateCartBadge();
        });
    </script>
