<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Joueur de foot en silhouette noire - Futbolero logo -->
  <g fill="currentColor">
    <!-- Tête -->
    <circle cx="50" cy="20" r="8" />
    
    <!-- Corps -->
    <rect x="46" y="30" width="8" height="18" rx="2" />
    
    <!-- Bras gauche vers le haut -->
    <rect x="30" y="28" width="16" height="6" rx="3" transform="rotate(-40 38 31)" />
    
    <!-- Bras droit vers le bas -->
    <rect x="54" y="32" width="16" height="6" rx="3" transform="rotate(50 62 35)" />
    
    <!-- Jambe gauche -->
    <rect x="41" y="48" width="6" height="20" rx="3" transform="rotate(-25 44 48)" />
    
    <!-- Jambe droite -->
    <rect x="53" y="48" width="6" height="20" rx="3" transform="rotate(35 56 48)" />
    
    <!-- Ballon de foot petit -->
    <circle cx="70" cy="35" r="5" fill="none" stroke="currentColor" stroke-width="1.5" />
    <path d="M 70 30 Q 72 35 70 40 Q 68 35 70 30" fill="currentColor" />
  </g>
</svg>