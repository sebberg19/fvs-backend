<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="co-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Maillots Nations - Futbolero Vintage Shop</title>

    <!-- Fonts + Bootstrap + Icons -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Styles -->
    <style>
        :root {
            --bg: #f7f8f9; --surface: #ffffff; --text: #121314; --muted: #6b6f76; --border: #e9ebf0;
            --accent: #2f6f3e; --accent-contrast: #ffffff;
        }
        html, body { 
            height: 100%; 
            background: var(--bg); 
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
        }
        
        .btn-accent {
            --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent);
            --bs-btn-hover-bg: #285a33; --bs-btn-hover-border-color: #285a33;
            --bs-btn-color: var(--accent-contrast); --bs-btn-focus-shadow-rgb: 47,111,62;
        }
        
        .btn-dark {
            background-color: #000 !important;
            border-color: #000 !important;
            color: #fff !important;
        }
        
        .btn-accent, .btn-dark { 
            transition: transform .12s ease; 
            transform-origin: center center; 
        }
        .btn-accent:hover, .btn-dark:hover { 
            transform: scale(1.035); 
        }
        
        .product-card {
            border: 1px solid var(--border);
            background: var(--surface);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-color: var(--accent);
        }
        
        .product-image {
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image img {
            transform: scale(1.05);
        }
        
        .product-info {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.5rem;
        }
        
        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            margin: 0;
            line-height: 1.3;
        }
        
        .product-price {
            font-size: 0.85rem;
            color: #000;
            font-weight: 600;
            margin: 0.25rem 0;
        }
        
        .product-btn {
            background: #000 !important;
            color: #fff !important;
            border: none;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 4px;
            transition: transform 0.2s ease;
            width: 100%;
            margin-top: auto;
        }
        
        .search-icon-btn {
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            transition: all 0.12s ease;
            border-radius: 0 .375rem .375rem 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        #search-input {
            border-radius: .375rem 0 0 .375rem;
        }
        
        #search-input:focus {
            box-shadow: none !important;
            border-color: #000000 !important;
            outline: none !important;
        }
        
        .input-group-text, #search-input, #clear-search {
            border-color: #000000;
        }
    </style>
</head>
<body>
    <!-- Navigation simple -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">

</body>
