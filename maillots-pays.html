    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('carousel-search-input');
            const clearButton = document.getElementById('carousel-clear-search');
            const resultsCount = document.getElementById('carousel-search-results-count');
            const productsContainer = document.querySelector('.row.g-0');
            
            function generateProductId(imagePath, productName) {
                const combined = (imagePath || productName || '').toLowerCase();
                const normalized = combined.replace(/[^a-z0-9]/g, '');
                let hash = 0;
                for (let i = 0; i < normalized.length; i++) {
                    const char = normalized.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                const id = Math.abs(hash).toString(36).toUpperCase().padStart(6, '0');
                return id.slice(0, 6);
            }

            function normalizeText(s) {
              return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
            }

            document.querySelectorAll('.product-card').forEach(card => {
                const title = card.querySelector('.product-title')?.textContent || 'item';
                const img = card.querySelector('[data-img]')?.getAttribute('data-img') || '';
                const productId = generateProductId(img, title);
                card.setAttribute('data-id', productId);
                card.setAttribute('data-product-id', productId);
            });

            function showNoResults() {
              let message = document.querySelector('.no-results');
              if (!message) {
                message = document.createElement('div');
                message.className = 'col-12 no-results text-center';
                message.innerHTML = `
                  <i class="fas fa-search fa-3x mb-3 text-muted"></i>
                  <h4 class="text-muted">Aucun maillot trouve</h4>
                  <p class="text-muted">Essayez avec un autre terme de recherche</p>
                `;
                productsContainer.appendChild(message);
              }
            }

            function hideNoResults() {
              const message = document.querySelector('.no-results');
              if (message) message.remove();
            }

            let searchTimeout;
            function performSearch() {
                const query = searchInput.value.trim();
                
                if (typeof searchProducts === 'function') {
                    const visibleCount = searchProducts(productsContainer, query, {
                        isVintage: false,
                        crossSectionLabel: '',
                        showCrossSectionResults: true
                    });

                    if (query === '') {
                        resultsCount.textContent = '';
                        hideNoResults();
                    } else if (visibleCount === 0) {
                        resultsCount.textContent = 'Aucun maillot trouve';
                        showNoResults();
                    } else if (visibleCount === 1) {
                        resultsCount.textContent = '1 maillot trouve';
                        hideNoResults();
                    } else {
                        resultsCount.textContent = `${visibleCount} maillots trouves`;
                        hideNoResults();
                    }
                } else {
                    const normalizedQuery = normalizeText(query);
                    let matches = 0;

                    document.querySelectorAll('.product-card').forEach(card => {
                        const title = normalizeText(card.querySelector('.product-title').textContent);
                        const productId = (card.getAttribute('data-id') || '').toLowerCase();
                        const show = query === '' || title.includes(normalizedQuery) || productId === normalizedQuery;
                        card.parentElement.style.display = show ? '' : 'none';
                        if (show) matches++;
                    });

                    if (query === '') {
                        resultsCount.textContent = '';
                        hideNoResults();
                    } else if (matches === 0) {
                        resultsCount.textContent = 'Aucun maillot trouve';
                        showNoResults();
                    } else if (matches === 1) {
                        resultsCount.textContent = '1 maillot trouve';
                        hideNoResults();
                    } else {
                        resultsCount.textContent = `${matches} maillots trouves`;
                        hideNoResults();
                    }
                }
            }

            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(performSearch, 150);
            });

            clearButton.addEventListener('click', () => {
                searchInput.value = '';
                performSearch();
                searchInput.focus();
            });

            function updateCartBadge() {
                let cart = [];
                try { cart = JSON.parse(localStorage.getItem('cartItems') || '[]'); } catch {}
                const badge = document.querySelector('.cart-badge');
                if (badge) {
                    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
                    badge.textContent = count;
                    badge.style.display = count > 0 ? 'inline' : 'none';
                }
            }

            updateCartBadge();
        });
    </script>
